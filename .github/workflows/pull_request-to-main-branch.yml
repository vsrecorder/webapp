name: For pull request to main branch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "master"

# GITHUB_TOKEN の権限は、リポジトリの取得(checkout)に要る読み取りだけにする。
# リポジトリの設定(Settings → Actions → Workflow permissions)が書き込み可に変わっても、
# ここで絞った権限が優先される。このワークフローは GitHub への書き込み(コメント・リリース・
# タグなど)をしないので、書き込みが要るステップを足すときは、そのジョブにだけ permissions を書き足すこと。
permissions:
  contents: read

#
# Dependabot(と fork)からの PR には、リポジトリの secrets が一切渡らない(すべて空文字になる)。
# そのままだとレジストリへのログインと Slack 通知で必ず落ち、中身を何も検証しないまま
# 「失敗」になっていた。secrets が無いときはログイン・push・通知を飛ばし、ビルドだけ行う。
#
# Dependabot 用の secrets(Settings → Secrets → Dependabot)を登録して通す手もあるが、採らない。
# 依存の更新という一番疑ってかかるべき変更に Docker Hub の書き込み権限を渡し、
# レビュー前の中身で develop のイメージを上書きさせることになるため。
#
# Firebase などの build-arg も空になる。NEXT_PUBLIC_* は値がビルド結果へ埋め込まれるだけで、
# 空でもビルドは通る(画面で auth/invalid-api-key になるだけ。push しないので問題ない)。
#
jobs:
  # lint(npm run lint)と vitest(npm test)。secrets は使わないので、Dependabot・fork の PR でもそのまま走る。
  # ビルドとは並行に走らせ、互いの結果を待たない(lint・テストが落ちても develop の push は止めない)。
  # 結果は notify-slack と PR のチェック欄に出る。
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Dockerfile の base(node:26.13.1-trixie-slim)と揃える。上げるときは両方を変える
          node-version: "26.13.1"
          cache: npm
      - name: Install Dependencies
        id: install
        run: npm ci
      - name: Run Lint
        run: npm run lint
      # lint が落ちてもテストは走らせ、両方の結果を一度に見られるようにする
      - name: Run Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  build-and-push-container-image:
    runs-on: ubuntu-latest
    env:
      # secrets は steps の if で直接参照できないので、ジョブの env に真偽を移して使う
      HAS_REGISTRY_CREDENTIALS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        if: env.HAS_REGISTRY_CREDENTIALS == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Container Image
        run: |
          DOCKER_BUILDKIT=1 \
          docker build . \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            --cache-from vsrecorder/webapp:develop \
            --tag vsrecorder/webapp:develop
      - name: Push Container Image
        if: env.HAS_REGISTRY_CREDENTIALS == 'true'
        run: |
          docker push vsrecorder/webapp:develop
      # 飛ばしたことを実行結果の画面に残す。secrets の名前を変えたり消したりしたときに、
      # 自分の PR でも push されないまま「成功」になるのを見落とさないため。
      - name: Report Skipped Push
        if: env.HAS_REGISTRY_CREDENTIALS != 'true'
        run: |
          echo "::notice::レジストリの secrets が渡されていないため、ログインと push を飛ばしてビルドだけ行いました(Dependabot・fork の PR では正常)"

  notify-slack:
    if: ${{ always() }}
    needs:
      - lint-and-test
      - build-and-push-container-image
    runs-on: ubuntu-latest
    env:
      HAS_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - name: Checkout Repository
        if: env.HAS_SLACK_WEBHOOK == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slack Notification
        if: env.HAS_SLACK_WEBHOOK == 'true'
        run: |
          SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
          SUCCESS="${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" \
          WORKFLOW="${{ github.workflow }}" \
          SERVER_URL="${{ github.server_url }}" \
          REPOSITORY="${{ github.repository }}" \
          BRANCH="${{ github.ref_name }}" \
          SHA="${{ github.sha }}" \
          RUN_ID="${{ github.run_id }}" \
          ACTOR="${{ github.actor }}" \
          /bin/bash ./.github/scripts/notify_slack.sh
