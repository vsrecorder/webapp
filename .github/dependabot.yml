# Dependabot の設定(依存の更新を週 1 回、PR として提案させる)
#
# 2026-10-31 のセキュリティ精査で、既知の脆弱性を含む依存や、サポートの切れたツールチェーン
# (Go 1.25)・ベースイメージが気付かれないまま残っていたため導入した。
#
# - マイナー・パッチの更新はエコシステムごとに 1 本の PR にまとめる(PR の数を増やさない)。
#   メジャーの更新は依存ごとに別の PR になるので、変更点を読んでから取り込む。
# - cooldown: 公開から 7 日たっていない版は提案しない。乗っ取られたアカウントから公開された
#   直後の版をそのまま取り込む、サプライチェーン攻撃の典型を避けるため。
#   脆弱性の修正(security updates)には cooldown が効かないので、そちらは待たずに来る。
# - 脆弱性のアラートと修正 PR(security updates)は、この設定ファイルとは別に、GitHub の
#   リポジトリの Settings → Advanced Security で Dependabot alerts / security updates を有効にする。
version: 2
updates:
  # npm の依存(package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Dockerfile のベースイメージ。ビルド用の node(タグ)と、実行用のディストロレス(ダイジェスト)。
  # ディストロレスは版のタグが無くダイジェストで固定しているので、ダイジェストの更新が PR で来る。
  # 実行時の Node のパッチ版はこの PR で上がる(Dockerfile 冒頭を参照)。
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # GitHub Actions のアクション(.github/workflows)。まとめて 1 本の PR にする
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
